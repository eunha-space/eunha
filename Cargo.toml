[package]
name = "eunha"
version = "0.2.0+mastodon.4.7.1"
edition = "2021"
license = "AGPL-3.0-only"
default-run = "eunha"

[[bin]]
name = "eunha"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "first_contact"
path = "tests/first_contact.rs"

[[test]]
name = "remote_replies"
path = "tests/remote_replies.rs"

[[bin]]
name = "eunha-upload-media"
path = "src/bin/upload_media.rs"

[[bin]]
name = "eunha-init-r2"
path = "src/bin/init_r2.rs"

[[bin]]
name = "eunha-send-test-push"
path = "src/bin/send_test_push.rs"

[[bin]]
name = "eunha-generate-secrets"
path = "src/bin/generate_secrets.rs"

[[bin]]
name = "eunha-schema"
path = "src/bin/schema.rs"

[[bin]]
name = "eunha-fedisim"
path = "src/bin/fedisim.rs"

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots", "pool"] }
# Web framework
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
ipnet = "2"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Auth / Crypto
argon2 = "0.5"
bcrypt = "0.15"
rand = "0.9"
base64 = "0.22"
serde_urlencoded = "0.7"
serde_qs = "0.13"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
# Base32 TOTP secrets and the QR code that carries them (src/two_factor.rs)
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }

# HTTP client (federation)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# ActivityPub vocabulary (typed activity construction)
ojak-vocab = { git = "https://github.com/eunha-space/ojak.git" }
# The framework: serving, the inbox, signatures (`ojak::sig`), and queued
# delivery, with its queue in `eunha.ojak_queue`.
ojak = { git = "https://github.com/eunha-space/ojak.git" }
ojak-postgres = { git = "https://github.com/eunha-space/ojak.git" }
# Serving what other servers fetch (src/api/ap/serving.rs).
ojak-axum = { git = "https://github.com/eunha-space/ojak.git" }

# Raising the process's open-file limit (src/open_files.rs)
libc = "0.2"

# Config / environment
config = "0.15"
dotenvy = "0.15"

# Utilities
url = { version = "2", features = ["serde"] }
urlencoding = "2"
minijinja = "2"
# Markdown for policy documents, rendered the way Redcarpet does (src/markdown.rs)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
mime = "0.3"
mime_guess = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = { version = "0.20", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1"
futures = "0.3"
itertools = "0.14"
indexmap = "2"
regex = "1"
unicode-segmentation = "1"
once_cell = "1"
ammonia = "4"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
blurhash = "0.2"
csv = "1"
img-parts = "0.4.0"
scraper = "0.23"

# Rails ActiveRecord::Encryption compatibility (keypairs.private_key)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
flate2 = "1"
# Archive takeout (src/portability/backup.rs), zipped as Mastodon's rubyzip does
zip = { version = "2", default-features = false, features = ["deflate"] }

# Push notifications (VAPID + Web Push)
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
web-push = "0.10"

# Redis (home timeline fan-out)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Unicode emoji validation (announcement reactions)
emojis = "0.9"

# Email MX checks at sign-up (Mastodon's `EmailMxValidator`)
hickory-resolver = { version = "0.25", features = ["tokio"] }
htmlize = { version = "1.1.0", features = ["entities"] }
chardetng = "1.0.0"
roxmltree = "0.21.1"
encoding_rs = "0.8"

[dev-dependencies]
axum-test = "17"
# Used to build signatures by hand in tests, independently of the signer under
# test, so that a test of "does this verify?" is not also a test of our own
# signing code.
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
# The checks every ojak queue backend has to pass, run against the table
# eunha's migrations build.
ojak = { git = "https://github.com/eunha-space/ojak.git", features = ["testing"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-tungstenite = "0.26"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
