[[divergence]]
id = "email-subscription-unsubscribe-token"
kind = "behaviour"
summary = "Without `secret_key_base`, unsubscribe links carry the subscription's confirmation token"
mastodon = """
Links `/unsubscribe` with a signed GlobalID of the subscription \
(`to_sgid(for: 'unsubscribe')`), signed with `secret_key_base` and valid for \
a month."""
eunha = """
Configured with the Mastodon's `secret_key_base`, links and reads exactly \
that GlobalID. Without it, links `/unsubscribe?token=` with the \
subscription's confirmation token, which Mastodon keeps after confirming; it \
does not expire, and a link Mastodon mailed is not recognised. The \
confirmation token is read either way."""
why = """
Without `secret_key_base` eunha cannot sign or verify a GlobalID. The \
confirmation token is as secret, was only ever sent to the subscriber, and is \
unique by index, so it names the subscription without a new column. A link \
that keeps working is what an unsubscribe link is for, so the ones eunha \
mailed before the secret was configured are still honoured."""
evidence = "tests/integration/c2s/email_subscriptions.rs"
since = "4.7.1"
reviewed_for = "4.7.2"

[[divergence]]
id = "notification-email-unsubscribe-token"
kind = "behaviour"
summary = "Without `secret_key_base`, notification email unsubscribe links are signed with a VAPID-derived key; quotes are covered"
mastodon = """
Links `/unsubscribe?token=&type=` with the user's signed GlobalID \
(`to_sgid(for: 'unsubscribe')`, keyed from `secret_key_base`, valid for a \
