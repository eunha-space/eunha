[[divergence]]
id = "email-subscription-unsubscribe-token"
kind = "behaviour"
summary = "Unsubscribe links carry the subscription's confirmation token"
mastodon = """
Links `/unsubscribe` with a signed GlobalID of the subscription \
(`to_sgid(for: 'unsubscribe')`), signed with `secret_key_base` and valid for \
a month."""
eunha = """
Links `/unsubscribe?token=` with the subscription's confirmation token, which \
Mastodon keeps after confirming. It does not expire, and a link Mastodon \
mailed before the instance moved to eunha is not recognised."""
why = """
Eunha does not have Mastodon's `secret_key_base` and cannot sign or verify a \
