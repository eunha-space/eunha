summary = "Serves two-factor authentication and security key settings over a REST API"
mastodon = """
Sets up an authenticator app, regenerates recovery codes, turns two-factor \
authentication off, and adds or removes security keys only through \
`/settings/two_factor_authentication*` and `/settings/security_keys` web \
forms behind a session, asking for the password once an hour \
(`ChallengableConcern`)."""
eunha = """
Serves them under `/api/eunha/v1/two_factor_authentication`, to a token with \
`read:accounts` or `write:accounts`. Starting setup, new recovery codes, \
turning it off, and asking for security key options or removing a key each \
take the password in the request. The secret, recovery codes and keys are \
stored as Mastodon stores them."""
why = """
Eunha's settings page is a single-page app holding a token, not a session. \
A token is easier to hand to a third party than a session cookie, so every \
change that weakens the account asks for the password with it rather than \
trusting the scope alone."""
evidence = "tests/integration/surfaces/two_factor.rs"
since = "4.7.1"
reviewed_for = "4.7.2"

