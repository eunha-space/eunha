[[divergence]]
id = "admin-granted-invites"
kind = "addition"
summary = "An admin can mint invites into another member's account"
mastodon = """
Ties an invite to whoever created it, and `invite_users` is the whole of the \
question: a member may create as many as they like, or none at all. There is no \
way to give somebody an invite, and `InvitesController#index` refuses the list \
to anyone who may not create one."""
eunha = """
Serves `POST /api/eunha/v1/invite_grants`, which creates codes owned by a named \
member — or by every eligible local member — for anyone holding `manage_invites`. \
Each new grant has metadata in the eunha schema and bypasses staff approval, \
without changing the member’s role. Listing owned invites needs no permission. \
Legacy and self-created codes retain role-based approval."""
why = """
An instance that wants to say 'you may bring two people' has nothing in \
Mastodon to say it with. Taking `invite_users` away leaves the admin as the \
only inviter, and that flattens the invite tree: everyone becomes a child of \
the admin rather than of whoever actually brought them. Minting the codes in \
the member's own name keeps the lineage true, and makes the count itself the \
limit — so there is no allowance to keep books on, and an invite is still just \
an invite."""
evidence = "tests/integration/surfaces/invite_grants.rs"
since = "4.7.0"
reviewed_for = "4.7.2"

[[divergence]]
id = "command-line-force-checks-before-deleting"
kind = "behaviour"
summary = "`eunha accounts create --reattach --force` deletes nothing for an account it would refuse"
mastodon = """
`tootctl accounts create --reattach --force` runs `DeleteAccountService` on the \
account holding the username, user and all, before it validates the new user; \
a new user then refused for its address or format still leaves the old account \
deleted."""
eunha = """
Every validation the new user has to pass — the username's format and length, \
the address's format, uniqueness and blocks, the role — is checked first, and \
the old account is deleted only once the new one is known to be valid; the \
address the deleted user held counts as free. What follows the deletion is \
upstream's."""
why = """
`--force` destroys an account someone is using, statuses and all, and cannot \
be undone. Doing it for a command that then fails over a typo in the address \
would lose the account for nothing; checking first changes no outcome of a \
command that succeeds."""
evidence = "tests/integration/surfaces/accounts_commands.rs"
since = "4.7.1"
reviewed_for = "4.7.2"

