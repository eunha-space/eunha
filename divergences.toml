[[divergence]]
id = "reply-fetches-run-in-process"
kind = "behaviour"
summary = "Walks a remote thread's replies in one task, fetching each reply once"
mastodon = """
Queues `ActivityPub::FetchAllRepliesWorker`, which fetches each reply to read \
its `replies` collection and queues a `FetchReplyWorker` that fetches it again \
to store it, retried three times. Each stored reply goes through `Create` \
processing, which reads the first page of its own replies, and a reply \
already held is processed again as an `Update`."""
eunha = """
Runs the walk as one task in the instance's process, storing each reply from \
the same request its collection is read from, without retries. Replies \
already held are not refreshed, and fetched replies do not have their own \
first page read. An instance that stops mid-walk marks its async refresh \
finished."""
why = """
The walk is bounded (1,000 replies, 500 pages) and repeated at most every \
fifteen minutes per post, so the post's next walk recovers what a failed \
fetch missed; a durable queue would add a table and a worker for work that \
is safe to lose. Fetching each reply once halves the requests a walk makes \
of the remote server. Eunha stores fetched posts through its lighter remote \
status path, which neither refreshes known posts nor recurses."""
evidence = "tests/remote_replies.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "terms-of-service-config-fallback"
