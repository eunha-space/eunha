since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "no-limited-federation-mode"
kind = "omission"
summary = "Has no limited federation mode"
mastodon = """
With `LIMITED_FEDERATION_MODE`, federates only with domains on the allow list, \
suspends a domain's accounts when it is taken off the list, and hides the peers \
and activity APIs."""
eunha = """
Keeps and serves the domain allow list, but federates with everyone not \
blocked whatever it holds; `/api/v2/instance` reports `limited_federation: \
false`."""
why = """
Allow-list federation is a deployment mode, set per process in Mastodon's \
environment, and eunha's hosted instances share a process and its \
configuration. Supporting it per instance is a design question for the \
tenant configuration rather than a port, so it waits for a decision."""
evidence = "tests/integration/c2s/instance.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

