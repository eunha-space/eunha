reviewed_for = "4.7.1"

[[divergence]]
id = "email-distribution-in-process"
kind = "behaviour"
summary = "The five-minute wait before mailing subscribers runs in the process"
mastodon = """
Schedules `EmailDistributionWorker` in Sidekiq five minutes after the first \
post of a batch, unique per account for up to a day."""
eunha = """
Waits in a task of the eunha process, held unique by a Redis key that lives \
eleven minutes. A stopped instance leaves the batch in Redis for the next \
post to send; one that dies outright holds the next batch back until the key \
expires."""
why = """
Eunha has no durable queue for work due at a time, and a five-minute wait \
does not justify one: the batch itself is in Redis for an hour, as upstream \
keeps it, so what a restart can lose is only the timing. The short key keeps \
a crash from silencing an account's emails for a day."""
evidence = "tests/integration/c2s/email_subscriptions.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

