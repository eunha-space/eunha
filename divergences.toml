Without it, stores the token's plain SHA-256 there, which is read either way. \
The link, its six hours, and what following it does are Mastodon's."""
why = """
Without `secret_key_base` there is nothing to derive Devise's key from. \
Storing a digest still keeps the column from being enough to reset a \
password; the cost is that a link Mastodon mailed does not work on eunha, \
which matters only for a reset in flight when an instance switches."""
evidence = "tests/integration/surfaces/password_reset.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

