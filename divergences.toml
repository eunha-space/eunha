[[divergence]]
id = "account-moves-rest-api"
kind = "addition"
summary = "Serves account moves, redirects and aliases over the REST API"
mastodon = """
Moves an account, sets or cancels a redirect, and manages aliases from its web \
settings alone (`Settings::MigrationsController`, \
`Settings::Migration::RedirectsController`, `Settings::AliasesController`). \
The REST API has no endpoints for any of them."""
eunha = """
Serves `POST /api/v1/accounts/move`, `POST` and `DELETE \
/api/v1/accounts/redirect`, and `GET`, `POST` and `DELETE \
/api/v1/profile/aliases`. Each runs upstream's model and service — \
`AccountMigration` with its challenge, cooldown and validations and then \
`MoveService`, `Form::Redirect`, `AccountAlias` — and a refusal is a 422 \
carrying upstream's validation messages, such as `Validation failed: Acct is \
not an alias of this account`."""
why = """
Eunha's client is a single-page app with no server-rendered settings to \
inherit, so moving an account needs an API to call. Like `invites-rest-api`, \
these sit outside `/api/eunha/` at the paths upstream would plausibly use, and \
answer only what its forms would allow."""
evidence = "tests/integration/c2s/moves.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "migrated-follow-unfollows-on-queueing"
kind = "behaviour"
summary = "A follower moved to a remote account leaves the old one when its Follow is queued"
mastodon = """
`FollowMigrationService` hands a Follow of a remote new account to \
`ActivityPub::MigratedFollowDeliveryWorker`, which unfollows the old account \
only after the Follow has been delivered; a delivery that keeps failing keeps \
the old follow while Sidekiq retries."""
eunha = """
Unfollows the old account as soon as the Follow is in the delivery queue, which \
retries it on the same schedule as every other activity."""
why = """
Eunha's delivery queue is ojak's, and has no hook for work to run once one \
delivery succeeds. The queue is durable, so the Follow is not lost; what \
differs is only the window in which an undeliverable Follow leaves the \
follower following neither account."""
evidence = "tests/integration/federation/moves.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "admin-granted-invites"
kind = "addition"
summary = "An admin can mint invites into another member's account"
mastodon = """
Ties an invite to whoever created it, and `invite_users` is the whole of the \
question: a member may create as many as they like, or none at all. There is no \
way to give somebody an invite, and `InvitesController#index` refuses the list \
to anyone who may not create one."""
eunha = """
Serves `POST /api/eunha/v1/invite_grants`, which creates codes owned by a named \
member — or by every member — for anyone holding `manage_invites`. Listing your \
own invites needs no permission, so a member who may not create one can still \
read what they were given."""
why = """
An instance that wants to say 'you may bring two people' has nothing in \
Mastodon to say it with. Taking `invite_users` away leaves the admin as the \
only inviter, and that flattens the invite tree: everyone becomes a child of \
the admin rather than of whoever actually brought them. Minting the codes in \
the member's own name keeps the lineage true, and makes the count itself the \
limit — so there is no allowance to keep books on, and an invite is still just \
an invite."""
evidence = "tests/integration/surfaces/invite_grants.rs"
since = "4.7.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "command-line-accounts-are-confirmed"
kind = "behaviour"
summary = "`eunha accounts` creates confirmed accounts quietly, and only resets passwords"
mastodon = """
`tootctl accounts create` saves the user unconfirmed unless given \
`--confirmed`, and mails a confirmation link. A confirmed, approved account \
then runs `User#prepare_new_user!`: a welcome e-mail an hour later, and an \
`admin.sign_up` notification to everyone who may manage users. It also takes \
`--reattach` and `--force` to hand an existing username to the new user. \
`tootctl accounts modify --reset-password` runs `User#change_password!`, which \
also publishes `kill` for each revoked token so open streaming connections \
close."""
eunha = """
`accounts create` refuses to run without `--confirmed`, sends no mail, notifies \
nobody, and has no `--reattach` or `--force`; the account, its role and its \
approval are otherwise decided as upstream decides them. `accounts modify` \
takes only `--reset-password`, which changes the password and revokes sessions, \
grants, tokens and push subscriptions as upstream does, but leaves a streaming \
connection a running server already holds open until it reconnects."""
why = """
An unconfirmed account in eunha is a row in `eunha.pending_signups` keyed by \
the link it mails, so there is nothing to create without sending mail — and the \
command is how a new instance gets its first account, before mail may be set \
up. The first account's staff notification would go to itself. Reattaching \
deletes an account in use, which a command meant for provisioning should not \
be able to do by mistake. Streaming connections live on an in-process bus the \
command, a separate process, cannot reach."""
evidence = "tests/integration/surfaces/accounts_commands.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "delivery-circuit-breaker-per-process"
kind = "behaviour"
summary = "The circuit breaker on deliveries counts each process's failures apart"
mastodon = """
`ActivityPub::DeliveryWorker` runs each delivery through a Stoplight for its \
inbox, threshold 10 and cool-off 60 seconds, whose failures are kept in Redis \
and counted across every Sidekiq process."""
eunha = """
The same breaker, ten failures in a row and a minute's cool-off for each \
inbox, held back deliveries counting as failed attempts, but kept in the \
memory of each process's deliverer: with several processes delivering, an \
inbox may be tried up to ten times in each before it is held back. Once the \
cool-off has passed every delivery to it is let through, where Stoplight's \
half-open light lets through a few to test it."""
why = """
ojak keeps its breakers in memory, beside the per-host limits it already \
keeps there. A breaker only paces attempts at a server that is not answering; \
which deliveries arrive, and when one is given up on, do not depend on it."""
evidence = "tests/integration/federation/delivery_failures.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "delivery-401-retried-for-gone-senders"
kind = "behaviour"
summary = "A 401 to a deleted or suspended sender's delivery is retried"
mastodon = """
`response_error_unsalvageable?` gives up on a delivery at once on 501 and any \
4xx but 401, 408 and 429; on 401 too when the sending account is permanently \
unavailable (`unsalvageable_authorization_failure?`)."""
eunha = """
Gives up at once on the same statuses, but retries a 401 whoever the sender \
is, until the retry policy gives up on it."""
why = """
ojak decides whether a status is final from the status alone. A 401 to a \
deleted account's delivery is the other server refusing a key it can no \
longer fetch, and its retries end where any other's do."""
evidence = "tests/integration/federation/delivery_failures.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "delivery-failures-reset-by-vouched-actor"
kind = "behaviour"
summary = "A delivery to our inbox clears the failures of its actor's host"
mastodon = """
`InboxesController` resets the delivery failure tracker for the host of the \
inbox of the actor that signed the request."""
eunha = """
Resets it for the host of the actor the activity is vouched for, once ojak has \
accepted it: the signer's own, unless another server forwarded it."""
why = """
ojak hands the listener the actor it vouches for rather than the signer of the \
request, and an actor's inbox is on its own host in every implementation eunha \
federates with. A forwarded activity clears the failures of the server that \
wrote it rather than the one that passed it on, which is up all the same."""
evidence = "tests/integration/federation/delivery_failures.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

