# Where eunha deliberately differs from the Mastodon release it implements.
#
# Eunha aims for behavioural parity, so a difference is either a bug or a
# decision. This file is where the decisions live, and it exists because prose
# in a README cannot be checked and therefore rots: `cargo test` reads this file
# and fails when it stops describing the code.
#
# Every entry carries `reviewed_for`, the Mastodon release the decision was last
# weighed against. Adopting a newer release fails the suite until each entry is
# re-examined and its `reviewed_for` moved forward — a divergence that made sense
# against one release is not automatically right against the next, and upstream
# may have since adopted, changed, or ruled out the same idea.
#
# Adding an entry:
#   id           kebab-case, stable; referenced by commit messages and issues
#   kind         addition   — eunha does something Mastodon does not
#                omission   — Mastodon does something eunha does not
#                behaviour  — both do it, differently
#   mastodon     what the tracked release does, stated plainly
#   eunha        what eunha does instead
#   why          the reason, not a restatement of `eunha`
#   evidence     a test that would fail if this stopped being true
#   since        the Mastodon release the divergence was introduced against
#   reviewed_for the Mastodon release it was last judged correct for

[[divergence]]
id = "integrity-proofs-on-outgoing-activities"
kind = "addition"
summary = "Signs FEP-8b32 integrity proofs, and issues the Ed25519 keys to do it"
mastodon = """
Verifies `eddsa-jcs-2022` and `mldsa44-jcs-2024` proofs on inbound activities, \
but produces none, and publishes only an RSA `publicKey` on its actors."""
eunha = """
Attaches an `eddsa-jcs-2022` proof to outgoing activities when \
`sign_integrity_proofs` is on, and publishes the Ed25519 key that verifies it \
as a FEP-521a `Multikey` under `assertionMethod`. Off by default."""
why = """
An HTTP Signature authenticates the connection an activity arrived over, which \
says nothing about a copy that was relayed or forwarded; a proof authenticates \
the activity itself. Mastodon 4.7 verifies these, so they are read by the \
servers that matter. Off by default because an instance's traffic should look \
like Mastodon's until its administrator decides otherwise."""
evidence = "tests/integration/federation/integrity_proofs.rs"
since = "4.7.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "invite-tree"
kind = "addition"
summary = "Exposes who invited whom"
mastodon = "Records `users.invite_id` but offers no API for the resulting tree."
eunha = """
Serves `/api/eunha/v1/invite_tree`, and keeps `eunha.invite_lineage` so the \
lineage survives the inviter's account being deleted."""
why = """
An instance that grew by invitation has a shape worth seeing. It is served under \
`/api/eunha/` rather than `/api/v1/`, so no Mastodon client can mistake it for \
an endpoint Mastodon defines."""
evidence = "tests/integration/surfaces/invite_tree.rs"
since = "4.6.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "update-check-asks-about-mastodon"
kind = "behaviour"
summary = "Update notices are asked for only when configured, and are about the Mastodon release implemented"
mastodon = "Polls its update server by default, about its own version, reporting on itself."
eunha = """
Asks nothing unless `software_update_url` names a server. When one is named, \
asks that server about the Mastodon release eunha implements, and says so in \
the notices it sends."""
why = """
Eunha's version number means nothing to that server, and eunha is not Mastodon. \
What the question can honestly mean is 'is the schema and API eunha reproduces \
still supported?', which is worth an administrator's attention and is what gets \
asked when it is asked at all.

It is not asked by default because nothing in eunha reads the answer back. The \
notices are recorded for a Mastodon that may later boot on the database, and \
mailed to the instance's own administrators — who, on a hosted instance, cannot \
act on them, since only whoever runs the binary can take a release up. An \
operator who wants the end-of-support warning names the server and gets it."""
evidence = "tests/integration/surfaces/software_updates.rs"
since = "4.7.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "keypairs-migration-recorded-at-runtime"
kind = "behaviour"
summary = "The local-keypair migration is recorded when it happens, not in advance"
mastodon = """
Applies `20260702144128_migrate_local_account_keypairs` with the rest and \
records it in `schema_migrations` like any other."""
eunha = """
Leaves it out of the SQL migrations and records it only once the keys have \
actually moved, which needs ActiveRecord encryption keys configured."""
why = """
A ledger entry asserts the move has happened. Without encryption keys eunha \
cannot move them, and recording it anyway would tell a Mastodon booted on the \
database to skip work still outstanding. Leaving it unrecorded is safe either \
way: Mastodon runs it and moves the keys, or runs it and finds nothing to do."""
evidence = "tests/integration/federation/keypairs.rs"
since = "4.7.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "mute-does-not-silence-replies-to-me"
kind = "behaviour"
summary = "A mute hides someone's posts, but not what they address to me"
mastodon = """
Drops every status by a muted account from the viewer's timelines \
(`FeedManager#filter_from_home`), and — once `hide_notifications` is set — \
every notification from them (`NotifyService::DropCondition#drop?`), a mention \
of the viewer and a favourite of the viewer's own post among them."""
eunha = """
Exempts what is addressed to the viewer: a post that mentions them \
(non-silently), and a favourite, boost or quote of a post of theirs. Those \
appear in timelines and notify as though no mute were set, and a muted account \
that reacted to the viewer's own post is still listed under `favourited_by` and \
`reblogged_by`. A mute of a third party no longer drops a mention of the \
viewer, either. Everything else the mute does is unchanged, including follow \
notifications and the account's own posts."""
why = """
Muting someone you follow is how you stop reading them without unfollowing, \
which is a statement about their posts rather than about them. Mastodon's \
version also severs the channel back: mute a noisy colleague and you stop being \
told they replied to you, which reads as a bug to the person who muted them and \
is invisible to the one who was muted. Blocking is the relationship that cuts \
someone off, and it still does."""
evidence = "tests/integration/surfaces/mute_exemptions.rs"
since = "4.7.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "invites-rest-api"
kind = "addition"
summary = "Serves invite creation over the REST API"
mastodon = """
Creates, lists and revokes invites from its web UI alone. The REST API has no \
invite endpoints at all."""
eunha = """
Serves `/api/v1/invites`: list, create, and revoke. The authorization is \
upstream's own `InvitePolicy` — `invite_users` to create or list, and owning \
the invite or holding `manage_invites` to revoke."""
why = """
Eunha's client is a single-page app with no server-rendered admin to inherit, \
so its invite page needs an API to call. The risk this entry records is the \
namespace: every other eunha addition sits under `/api/eunha/` precisely so no \
Mastodon client can mistake it for something upstream defines, and these do \
not. They keep the paths upstream would use if it had them, and answer with \
what its own UI would allow, so a client that guessed at them is not misled \
about what it is talking to."""
evidence = "tests/integration/c2s/invites.rs"
since = "4.6.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "moderation-tools-rest-api"
kind = "addition"
summary = "Serves the moderation tools of Mastodon's web admin over the REST API"
mastodon = """
Has report notes, report actions on the cited posts, account moderation \
notes, the audit log, warning presets, \
username blocks, strikes and appeals, an account's posts and relationships, \
and user management (role, password reset, two-factor, email, confirmation) \
only as server-rendered admin and dispute pages. The REST API has none of \
them."""
eunha = """
Serves them under `/api/v1/admin/`: `report_notes`, \
`account_moderation_notes`, `reports/:id/history`, `reports/:id/actions` \
(upstream's report action buttons), `action_logs` and \
`action_logs/filters`, `warning_presets`, `username_blocks`, \
`disputes/appeals` with `approve` and `reject`, `accounts/:id/statuses` with \
`batch`, `accounts/:id/relationships`, `roles`, and on `accounts/:id`: \
`role`, `reset`, `two_factor_authentication`, `change_email`, `confirmation` \
and `confirmation/resend`. The account's own side is `/api/v1/disputes/strikes` \
with `appeal`. Each asks for the permission upstream's policy asks for and \
writes the audit log entries its controller writes. Listing warning presets \
is open to `manage_users` and `manage_reports` as well as `manage_settings`, \
because upstream's account action form shows them to those roles."""
why = """
Eunha's client is a single-page app with no server-rendered admin to inherit, \
so these pages need an API to call. Like `invites-rest-api`, they sit at the \
paths upstream's admin API would use, and answer only what its pages would \
allow."""
evidence = "tests/integration/c2s/moderation_tools.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "account-moves-rest-api"
kind = "addition"
summary = "Serves account moves, redirects and aliases over the REST API"
mastodon = """
Moves an account, sets or cancels a redirect, and manages aliases from its web \
settings alone (`Settings::MigrationsController`, \
`Settings::Migration::RedirectsController`, `Settings::AliasesController`). \
The REST API has no endpoints for any of them."""
eunha = """
Serves `POST /api/v1/accounts/move`, `POST` and `DELETE \
/api/v1/accounts/redirect`, and `GET`, `POST` and `DELETE \
/api/v1/profile/aliases`. Each runs upstream's model and service — \
`AccountMigration` with its challenge, cooldown and validations and then \
`MoveService`, `Form::Redirect`, `AccountAlias` — and a refusal is a 422 \
carrying upstream's validation messages, such as `Validation failed: Acct is \
not an alias of this account`."""
why = """
Eunha's client is a single-page app with no server-rendered settings to \
inherit, so moving an account needs an API to call. Like `invites-rest-api`, \
these sit outside `/api/eunha/` at the paths upstream would plausibly use, and \
answer only what its forms would allow."""
evidence = "tests/integration/c2s/moves.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "migrated-follow-unfollows-on-queueing"
kind = "behaviour"
summary = "A follower moved to a remote account leaves the old one when its Follow is queued"
mastodon = """
`FollowMigrationService` hands a Follow of a remote new account to \
`ActivityPub::MigratedFollowDeliveryWorker`, which unfollows the old account \
only after the Follow has been delivered; a delivery that keeps failing keeps \
the old follow while Sidekiq retries."""
eunha = """
Unfollows the old account as soon as the Follow is in the delivery queue, which \
retries it on the same schedule as every other activity."""
why = """
Eunha's delivery queue is ojak's, and has no hook for work to run once one \
delivery succeeds. The queue is durable, so the Follow is not lost; what \
differs is only the window in which an undeliverable Follow leaves the \
follower following neither account."""
evidence = "tests/integration/federation/moves.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "admin-granted-invites"
kind = "addition"
summary = "An admin can mint invites into another member's account"
mastodon = """
Ties an invite to whoever created it, and `invite_users` is the whole of the \
question: a member may create as many as they like, or none at all. There is no \
way to give somebody an invite, and `InvitesController#index` refuses the list \
to anyone who may not create one."""
eunha = """
Serves `POST /api/eunha/v1/invite_grants`, which creates codes owned by a named \
member — or by every member — for anyone holding `manage_invites`. Listing your \
own invites needs no permission, so a member who may not create one can still \
read what they were given."""
why = """
An instance that wants to say 'you may bring two people' has nothing in \
Mastodon to say it with. Taking `invite_users` away leaves the admin as the \
only inviter, and that flattens the invite tree: everyone becomes a child of \
the admin rather than of whoever actually brought them. Minting the codes in \
the member's own name keeps the lineage true, and makes the count itself the \
limit — so there is no allowance to keep books on, and an invite is still just \
an invite."""
evidence = "tests/integration/surfaces/invite_grants.rs"
since = "4.7.0"
reviewed_for = "4.7.1"

[[divergence]]
id = "command-line-accounts-are-confirmed"
kind = "behaviour"
summary = "`eunha accounts` creates confirmed accounts quietly, and only resets passwords"
mastodon = """
`tootctl accounts create` saves the user unconfirmed unless given \
`--confirmed`, and mails a confirmation link. A confirmed, approved account \
then runs `User#prepare_new_user!`: a welcome e-mail an hour later, and an \
`admin.sign_up` notification to everyone who may manage users. It also takes \
`--reattach` and `--force` to hand an existing username to the new user. \
`tootctl accounts modify --reset-password` runs `User#change_password!`, which \
also publishes `kill` for each revoked token so open streaming connections \
close."""
eunha = """
`accounts create` refuses to run without `--confirmed`, sends no mail, notifies \
nobody, and has no `--reattach` or `--force`; the account, its role and its \
approval are otherwise decided as upstream decides them. `accounts modify` \
takes only `--reset-password`, which changes the password and revokes sessions, \
grants, tokens and push subscriptions as upstream does, but leaves a streaming \
connection a running server already holds open until it reconnects."""
why = """
An unconfirmed account in eunha is a row in `eunha.pending_signups` keyed by \
the link it mails, so there is nothing to create without sending mail — and the \
command is how a new instance gets its first account, before mail may be set \
up. The first account's staff notification would go to itself. Reattaching \
deletes an account in use, which a command meant for provisioning should not \
be able to do by mistake. Streaming connections live on an in-process bus the \
command, a separate process, cannot reach."""
evidence = "tests/integration/surfaces/accounts_commands.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "delivery-circuit-breaker-per-process"
kind = "behaviour"
summary = "The circuit breaker on deliveries counts each process's failures apart"
mastodon = """
`ActivityPub::DeliveryWorker` runs each delivery through a Stoplight for its \
inbox, threshold 10 and cool-off 60 seconds, whose failures are kept in Redis \
and counted across every Sidekiq process."""
eunha = """
The same breaker, ten failures in a row and a minute's cool-off for each \
inbox, held back deliveries counting as failed attempts, but kept in the \
memory of each process's deliverer: with several processes delivering, an \
inbox may be tried up to ten times in each before it is held back. Once the \
cool-off has passed every delivery to it is let through, where Stoplight's \
half-open light lets through a few to test it."""
why = """
ojak keeps its breakers in memory, beside the per-host limits it already \
keeps there. A breaker only paces attempts at a server that is not answering; \
which deliveries arrive, and when one is given up on, do not depend on it."""
evidence = "tests/integration/federation/delivery_failures.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "delivery-401-retried-for-gone-senders"
kind = "behaviour"
summary = "A 401 to a deleted or suspended sender's delivery is retried"
mastodon = """
`response_error_unsalvageable?` gives up on a delivery at once on 501 and any \
4xx but 401, 408 and 429; on 401 too when the sending account is permanently \
unavailable (`unsalvageable_authorization_failure?`)."""
eunha = """
Gives up at once on the same statuses, but retries a 401 whoever the sender \
is, until the retry policy gives up on it."""
why = """
ojak decides whether a status is final from the status alone. A 401 to a \
deleted account's delivery is the other server refusing a key it can no \
longer fetch, and its retries end where any other's do."""
evidence = "tests/integration/federation/delivery_failures.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "delivery-failures-reset-by-vouched-actor"
kind = "behaviour"
summary = "A delivery to our inbox clears the failures of its actor's host"
mastodon = """
`InboxesController` resets the delivery failure tracker for the host of the \
inbox of the actor that signed the request."""
eunha = """
Resets it for the host of the actor the activity is vouched for, once ojak has \
accepted it: the signer's own, unless another server forwarded it."""
why = """
ojak hands the listener the actor it vouches for rather than the signer of the \
request, and an actor's inbox is on its own host in every implementation eunha \
federates with. A forwarded activity clears the failures of the server that \
wrote it rather than the one that passed it on, which is up all the same."""
evidence = "tests/integration/federation/delivery_failures.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

[[divergence]]
id = "admin-custom-emoji-rest-api"
kind = "addition"
summary = "Serves custom emoji administration over the REST API"
mastodon = """
Lists, uploads, enables, disables, copies and deletes custom emoji from its \
server-rendered admin pages alone. The REST API only lists the enabled ones, \
at `/api/v1/custom_emojis`."""
eunha = """
Serves `/api/v1/admin/custom_emojis`: list, upload (multipart), update \
`visible_in_picker` and `disabled`, and delete, behind upstream's own \
`manage_custom_emojis` permission."""
why = """
Eunha has no server-rendered admin; its moderation pages are a client of the \
