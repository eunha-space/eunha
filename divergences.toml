[[divergence]]
id = "refused-deliveries-accepted"
kind = "behaviour"
summary = "A delivery from a domain not federated with is answered 202 and dropped"
mastodon = """
Refuses the signature of a delivery whose key is on a domain it does not \
federate with (`domain_not_allowed?`: suspended, or off the allow list in \
limited federation mode) and answers 403, without fetching the key."""
eunha = """
Drops the delivery without fetching the key either, but answers 202, as ojak \
answers every activity its `blocked` hook refuses."""
why = """
Either answer ends the matter for the sender, which does not retry a 403 or a \
202. ojak answers 202 so that a server that cannot tell why it was refused \
stops sending, and an instance that does not federate with a domain has \
nothing to tell it. A fetch signed from such a domain is refused with 403, as \
Mastodon refuses it."""
evidence = "tests/integration/federation/authorized_fetch.rs"
since = "4.7.1"
reviewed_for = "4.7.1"

