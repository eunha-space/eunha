eunha = """
Does the same once any version has been published. Until then, an \
instance whose configuration has `terms_of_service` text serves it as a \
published version effective on 2025-01-01, already notified, and a new \
draft starts from it."""
why = """
Before eunha read the table it served the configured text, as effective on \
2025-01-01. Dropping it would take terms away from instances that had them; \
importing it would mean writing to the database from configuration on \
startup, which eunha does not do. Publishing once — the draft already holds \
the text — moves it into the table, after which the configuration is not \
read."""
evidence = "tests/integration/c2s/terms_of_service.rs"
