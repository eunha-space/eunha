# Where eunha deliberately differs from the Mastodon release it implements.
#
# Eunha aims for behavioural parity, so a difference is either a bug or a
# decision. This file is where the decisions live, and it exists because prose
# in a README cannot be checked and therefore rots: `cargo test` reads this file
# and fails when it stops describing the code.
#
# Every entry carries `reviewed_for`, the Mastodon release the decision was last
# weighed against. Adopting a newer release fails the suite until each entry is
# re-examined and its `reviewed_for` moved forward — a divergence that made sense
# against one release is not automatically right against the next, and upstream
# may have since adopted, changed, or ruled out the same idea.
#
# Adding an entry:
#   id           kebab-case, stable; referenced by commit messages and issues
#   kind         addition   — eunha does something Mastodon does not
#                omission   — Mastodon does something eunha does not
#                behaviour  — both do it, differently
#   mastodon     what the tracked release does, stated plainly
#   eunha        what eunha does instead
#   why          the reason, not a restatement of `eunha`
#   evidence     a test that would fail if this stopped being true
#   since        the Mastodon release the divergence was introduced against
#   reviewed_for the Mastodon release it was last judged correct for

[[divergence]]
id = "email-confirmation-result-with-browser-session"
kind = "behaviour"
summary = "Show the email confirmation result even when an account is signed in"
mastodon = "Browser email confirmations redirect to the web app when a browser session exists."
eunha = "Browser email confirmations show the result on the sign-in page regardless of the existing session; explicit redirects to signup applications are preserved."
why = "An account switcher can have a different account active, hiding the newly registered account's confirmation result on the timeline."
evidence = "tests/integration/surfaces/auth_pages.rs"
since = "4.7.1"
reviewed_for = "4.7.2"

[[divergence]]
id = "integrity-proofs-on-outgoing-activities"
kind = "addition"
summary = "Signs FEP-8b32 integrity proofs, and issues the Ed25519 keys to do it"
mastodon = """
Verifies `eddsa-jcs-2022` and `mldsa44-jcs-2024` proofs on inbound activities, \
but produces none, and publishes only an RSA `publicKey` on its actors."""
eunha = """
Attaches an `eddsa-jcs-2022` proof to outgoing activities when \
`sign_integrity_proofs` is on, and publishes the Ed25519 key that verifies it \
as a FEP-521a `Multikey` under `assertionMethod`. Off by default. An activity \
that also goes with a Linked Data signature gets the proof first, and the \
signature covers it, as Fedify orders them; Mastodon cannot check that \
signature without fetching the data integrity context, and reads the proof's \
graph into its default graph, so it takes the activity on the proof instead."""
why = """
An HTTP Signature authenticates the connection an activity arrived over, which \
says nothing about a copy that was relayed or forwarded; a proof authenticates \
the activity itself. Mastodon 4.7 verifies these, so they are read by the \
servers that matter. Off by default because an instance's traffic should look \
like Mastodon's until its administrator decides otherwise."""
evidence = "tests/integration/federation/integrity_proofs.rs"
since = "4.7.0"
reviewed_for = "4.7.2"

[[divergence]]
id = "invite-tree"
kind = "addition"
summary = "Exposes who invited whom"
mastodon = "Records `users.invite_id` but offers no API for the resulting tree."
eunha = """
Serves `/api/eunha/v1/invite_tree`, and keeps `eunha.invite_lineage` so the \
lineage survives the inviter's account being deleted. Roots explain missing \
ancestry without identifying excluded inviters; cyclic lineage retains every \
visible member. The web client supports branch navigation and ancestry-preserving \
search."""
why = """
An instance that grew by invitation has a shape worth seeing. It is served under \
`/api/eunha/` rather than `/api/v1/`, so no Mastodon client can mistake it for \
an endpoint Mastodon defines."""
evidence = "tests/integration/surfaces/invite_tree.rs"
since = "4.6.0"
reviewed_for = "4.7.2"

[[divergence]]
id = "update-check-asks-about-mastodon"
kind = "behaviour"
summary = "Update notices are asked for only when configured, and are about the Mastodon release implemented"
mastodon = "Polls its update server by default, about its own version, reporting on itself."
eunha = """
Asks nothing unless `software_update_url` names a server. When one is named, \
asks that server about the Mastodon release eunha implements, and says so in \
the notices it sends."""
why = """
Eunha's version number means nothing to that server, and eunha is not Mastodon. \
What the question can honestly mean is 'is the schema and API eunha reproduces \
still supported?', which is worth an administrator's attention and is what gets \
asked when it is asked at all.

It is not asked by default because the instance's administrators, who see the \
notices on the admin software updates page and the dashboard and by mail, \
cannot act on them on a hosted instance: only whoever runs the binary can take \
a release up. The notices are also recorded for a Mastodon that may later boot \
on the database. An operator who wants the end-of-support warning names the \
server and gets it."""
evidence = "tests/integration/surfaces/software_updates.rs"
since = "4.7.0"
reviewed_for = "4.7.2"

[[divergence]]
id = "keypairs-migration-recorded-at-runtime"
kind = "behaviour"
summary = "The local-keypair migration is recorded when it happens, not in advance"
mastodon = """
Applies `20260702144128_migrate_local_account_keypairs` with the rest and \
records it in `schema_migrations` like any other."""
eunha = """
Leaves it out of the SQL migrations and records it only once the keys have \
actually moved, which needs ActiveRecord encryption keys configured."""
why = """
A ledger entry asserts the move has happened. Without encryption keys eunha \
cannot move them, and recording it anyway would tell a Mastodon booted on the \
database to skip work still outstanding. Leaving it unrecorded is safe either \
way: Mastodon runs it and moves the keys, or runs it and finds nothing to do."""
evidence = "tests/integration/federation/keypairs.rs"
since = "4.7.0"
reviewed_for = "4.7.2"

[[divergence]]
id = "invites-rest-api"
kind = "addition"
summary = "Serves invite creation over the REST API"
mastodon = """
Creates, lists and revokes invites from its web UI alone. The REST API has no \
invite endpoints at all."""
eunha = """
Serves `/api/v1/invites`: list, create, and revoke. The authorization is \
upstream's own `InvitePolicy` — `invite_users` to create, and owning the \
invite or holding `manage_invites` to revoke. Listing owned codes remains \
available to members receiving admin-granted invites."""
why = """
Eunha's client is a single-page app with no server-rendered admin to inherit, \
so its invite page needs an API to call. The risk this entry records is the \
namespace: every other eunha addition sits under `/api/eunha/` precisely so no \
Mastodon client can mistake it for something upstream defines, and these do \
not. They keep the paths upstream would use if it had them, and answer with \
what its own UI would allow, so a client that guessed at them is not misled \
about what it is talking to."""
evidence = "tests/integration/c2s/invites.rs"
since = "4.6.0"
reviewed_for = "4.7.2"

