# cargo-nextest, which CI runs the tests with. `cargo test` still works as
# before; nextest is only faster, and runs each test in a process of its own.

[profile.ci]
# Report every failure rather than stopping at the first.
fail-fast = false
# A test still running after five minutes is stuck, not slow: end it rather
# than let it hold the runner for hours.
slow-timeout = { period = "60s", terminate-after = 5 }
