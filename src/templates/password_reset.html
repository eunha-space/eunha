<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if mode == "edit" %}{{ t_set_new_password }}{% else %}{{ t_reset_password }}{% endif %} · {{ domain }}</title>
<script>(function(){var t=localStorage.getItem('eunha-theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.add(d?'dark':'light')})();</script>
<link rel="stylesheet" href="/auth.css">
</head>
<body class="centered">
<div class="card">
  <h1>{% if mode == "edit" %}{{ t_set_new_password }}{% else %}{{ t_reset_password }}{% endif %}</h1>
  <p class="sub">{{ domain }}</p>
  {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if mode == "new" %}
  <form method="POST" action="/auth/password">
    <label for="email">{{ t_email }}</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus>
    <button type="submit">{{ t_reset_password }}</button>
  </form>
  {% elif mode == "edit" %}
  <form method="POST" action="/auth/password/edit">
    <input type="hidden" name="reset_password_token" value="{{ token }}">
    <label for="password">{{ t_new_password }}</label>
    <input type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" autofocus>
    <label for="password_confirmation">{{ t_confirm_new_password }}</label>
    <input type="password" id="password_confirmation" name="password_confirmation" required autocomplete="new-password">
    <button type="submit">{{ t_set_new_password }}</button>
  </form>
  {% endif %}
  <p class="footer"><a href="/account/login">{{ t_sign_in }}</a></p>
</div>
</body>
</html>
