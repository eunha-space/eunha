<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t_account }} · {{ domain }}</title>
<script>(function(){var t=localStorage.getItem('eunha-theme')||'system';var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.add(d?'dark':'light')})();</script>
<link rel="stylesheet" href="/auth.css">
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="centered">
<div class="card">
  <h1>{{ t_account }}</h1>
  <p class="sub">{{ domain }}</p>
  <div id="msg">
    {% if notice %}<div class="success">{{ notice }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
  <form hx-post="/account/login" hx-target="#msg" hx-swap="innerHTML">
    <label for="email">{{ t_email }}</label>
    <input type="email" id="email" name="email" required autocomplete="username">
    <label for="password">{{ t_password }}</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <button type="submit">{{ t_sign_in }}</button>
  </form>
  <p class="footer"><a href="/auth/password/new">{{ t_forgot_password }}</a></p>
</div>
</body>
</html>
