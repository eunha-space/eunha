# What has to hold before a change lands.
#
# Six of these exist because something drifted when nothing was watching:
# formatting went unenforced until thirteen files had moved and a commit shipped
# broken while separating real changes from the churn; the sqlx cache went stale
# and would have failed the deploy's offline build rather than the tests; the
# schema check is the 100%-compatibility claim, and a claim nothing checks stops
# being true; and the differential harness, which nothing ran, spent weeks
# reporting ten differences that were entirely its own. The federation
# harness had never run from a clean checkout at all, and the web client's
# browser tests sat with three failing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 18, because seoul.earth runs 18.3 and development runs 18.4 — and
        # because `001_initial.sql` is a `pg_dump` of the schema, whose preamble
        # sets `transaction_timeout`, a parameter Postgres 17 introduced. On 16
        # the very first migration fails and every gate after it never runs,
        # which is what had CI red on `main` while this file claimed six green
        # gates. The migration cannot lose the line: sqlx checksums it, and it
        # has already been applied to production.
        image: postgres:18
        env:
          POSTGRES_USER: eunha
          POSTGRES_PASSWORD: eunha
          POSTGRES_DB: eunha_test
        # `-U eunha`, because Docker runs a healthcheck as the image's user and
        # the Postgres image sets none — so it runs as root, `pg_isready`
        # defaults `-U` to the OS user, and there is no `root` role. It still
        # reports the server up, since any answer proves that, but it logs a
        # FATAL every interval: 284 of them in a 24-minute run, dumped into
        # "Stop containers" at the end where they read as a job going wrong.
        options: >-
          --health-cmd "pg_isready -U eunha" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgres://eunha:eunha@localhost/eunha_test
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Prepare the database
        run: |
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS eunha"
          cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          DATABASE_URL="$DATABASE_URL?options=-c%20search_path%3Deunha,public" \
            cargo sqlx migrate run

      # The deploy builds offline, so a query missing from `.sqlx` fails there
      # rather than here unless this runs — and it fails after the migrations
      # have already been applied.
      - name: Offline build matches the committed query cache
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --locked

      # Media uploads are transcoded with ffmpeg, as in the container image,
      # and the media tests make their videos and audio with it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Tests
        run: cargo test --locked

      # eunha exists to be a drop-in for a Mastodon database. This is the test
      # for that, and it needs neither Ruby nor the network: it compares the
      # database the migrations just built against a recorded reference.
      - name: Schema matches the tracked Mastodon release
        env:
          SQLX_OFFLINE: "true"
        run: cargo run --locked --bin eunha-schema -- check

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

  # The differential harness compares eunha against a real Mastodon rather than
  # against a reading of one, and until now nothing ran it. It spent weeks
  # reporting ten differences that were its own Mastodon booting without a
  # Sidekiq worker, and a stretch before that unable to start at all, because
  # the federation work had grown TLS proxies onto the compose file the two
  # shared. Neither is the sort of thing anyone notices by not looking.
  #
  # Slower than the rest — it pulls the Mastodon image and waits for
  # `db:prepare` — so it is a job of its own and runs alongside them.
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # 18, because seoul.earth runs 18.3 and development runs 18.4 — and
        # because `001_initial.sql` is a `pg_dump` of the schema, whose preamble
        # sets `transaction_timeout`, a parameter Postgres 17 introduced. On 16
        # the very first migration fails and every gate after it never runs,
        # which is what had CI red on `main` while this file claimed six green
        # gates. The migration cannot lose the line: sqlx checksums it, and it
        # has already been applied to production.
        image: postgres:18
        env:
          POSTGRES_USER: eunha
          POSTGRES_PASSWORD: eunha
          POSTGRES_DB: eunha
        # `-U eunha`, because Docker runs a healthcheck as the image's user and
        # the Postgres image sets none — so it runs as root, `pg_isready`
        # defaults `-U` to the OS user, and there is no `root` role. It still
        # reports the server up, since any answer proves that, but it logs a
        # FATAL every interval: 284 of them in a 24-minute run, dumped into
        # "Stop containers" at the end where they read as a job going wrong.
        options: >-
          --health-cmd "pg_isready -U eunha" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ["6379:6379"]

    env:
      # `createdb`, `dropdb` and `psql` take the connection from these; eunha
      # takes it from the URL. Both have to name the same database.
      PGHOST: localhost
      PGUSER: eunha
      PGPASSWORD: eunha
      EUNHA_DATABASE_URL: postgres://eunha:eunha@localhost/eunha_differential
      EUNHA_REDIS_URL: redis://127.0.0.1:6379/14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The harness wants a built binary rather than building one itself, the
      # same as `federation_test.sh`. Offline, because the compile-time database
      # this checkout points at is not the one the services provide.
      - name: Build eunha
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --bin eunha

      # No arguments: the harness brings up its own eunha, so this runs the path
      # a developer runs rather than one only CI knows how to set up.
      - name: Compare against a live Mastodon 4.7.2
        run: scripts/differential_test.sh

  # Federation: the two servers talking to each other, rather than each being
  # compared to a client's view of the other. This became runnable here at all
  # by moving eunha into the container network — it used to run on the host,
  # where it could not resolve `mastodon.test` and so rejected every inbound
  # activity. Nothing below sets anything up, because the harness now needs no
  # `/etc/hosts` entry, no trusted certificate and no eunha built for the host.
  #
  # The slowest gate: a release build of eunha inside Docker, then a Mastodon
  # boot, before a single check runs.
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Federate with a live Mastodon 4.7.2
        run: scripts/federation_test.sh

  # The web client's typecheck and its browser tests. Nothing ran them, and
  # three of them sat failing on main over a fixture the client had outgrown.
  # They run against the Vite dev server with every API call answered by the
  # test, so no backend is needed.
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm run build
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: pnpm exec playwright test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # The docs deploy only from main, so a dead link would otherwise be found by
  # the Pages workflow after it had landed. VitePress fails the build on one.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build the docs
        working-directory: docs
        run: pnpm install --frozen-lockfile && pnpm run build
